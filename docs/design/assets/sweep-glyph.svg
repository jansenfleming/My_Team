<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="t">
  <title id="t">ZeroJance sweep glyph</title>
  <!-- Inline this file so `color` (from tokens) drives it: set color to
       the sweep color tokens (zj-sweep-ok, zj-sweep-slow, zj-sweep-down). Uses currentColor only.
       #sweep is the rotating group: transform-origin 16px 16px. Static = no rotation. -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="7" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  <g id="sweep">
    <path d="M16 16 L29 16 A13 13 0 0 0 24.36 6.04 Z" fill="currentColor" opacity="0.35"/>
    <line x1="16" y1="16" x2="29" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <circle cx="22.9" cy="12" r="1.7" fill="currentColor"/>
</svg>
